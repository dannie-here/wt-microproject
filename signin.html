<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#103b32">
    <meta name="description" content="TripVista travel planning portal.">

    <title>Sign In | TripVista</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <script src="theme.js" defer></script>
    <script src="portal.js" defer></script>
</head>

<body class="portal-page">

<div class="portal-shell">

    <header class="portal-topbar">
        <a href="index.html" class="brand" aria-label="TripVista homepage">
            <span class="brand-icon">T</span>
            <span>Trip<span class="brand-accent">Vista</span></span>
        </a>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
            <span id="themeIcon" aria-hidden="true">☾</span>
        </button>
    </header>

    <main class="portal-card">

        <span class="eyebrow">WELCOME BACK</span>

        <h1>Sign in to TripVista</h1>

        <p class="portal-intro">
            Enter your credentials to validate their format.
        </p>

        <div id="signinAlert" class="portal-alert" role="alert" aria-live="assertive"></div>

        <form id="standaloneSigninForm" class="portal-form">

            <div class="portal-field full">
                <label for="signinEmailPage">Email Address</label>
                <input id="signinEmailPage" type="email" autocomplete="username" required>
            </div>

            <div class="portal-field full">
                <label for="signinPasswordPage">Password</label>

                <div class="password-wrap">
                    <input id="signinPasswordPage" type="password" autocomplete="current-password" minlength="8" required>
                    <button type="button" data-show-password="signinPasswordPage">Show</button>
                </div>
            </div>

            <button class="btn btn-primary portal-submit" type="submit">
                Sign In
            </button>

        </form>

        <p class="portal-note">
            This is a front-end demonstration. Actual authentication requires a secure backend.
        </p>

        <p class="portal-switch">
            New to TripVista?
            <a href="signup.html">Create an account</a> ·
            <a href="index.html">Return home</a>
        </p>

    </main>

</div>

</body>
</html>
